apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: hello-world-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      imagePullSecrets:
        - name: nexus-pull
      containers:
        - name: hello-world
          image: localhost:32082/hello-world:0.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
