# Local demo only. Jenkins uses the Docker engine on this laptop, so a push
# to localhost:32082 is the Nexus port published on the machine.
# The image gitops-demo-jenkins:local is built by install/install.ps1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: jenkins
          image: gitops-demo-jenkins:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_casc/jenkins.yaml
            - name: JAVA_OPTS
              value: -Djenkins.install.runSetupWizard=false
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: casc
              mountPath: /var/jenkins_casc
            - name: casc
              mountPath: /usr/share/jenkins/ref/init.groovy.d/executors.groovy
              subPath: executors.groovy
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: casc
          configMap:
            name: jenkins-casc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
