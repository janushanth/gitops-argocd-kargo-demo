apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc
  namespace: jenkins
data:
  jenkins.yaml: |
    jenkins:
      systemMessage: "Local GitOps demo. Login admin / admin is for this laptop only."
      numExecutors: 2
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "admin"
              password: "admin"
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousRead: false
    jobs:
      - script: |
          pipelineJob('hello-world') {
            displayName('Build Hello World and push to Nexus')
            definition {
              cps {
                sandbox(true)
                script(new File('/var/jenkins_casc/Jenkinsfile').text)
              }
            }
          }
  executors.groovy: |
    import jenkins.model.Jenkins
    def instance = Jenkins.instance
    instance.setNumExecutors(2)
    instance.save()
  Jenkinsfile: |
    pipeline {
      agent any
      stages {
        stage('Build and push') {
          steps {
            sh '''
              set -eu
              until docker info >/dev/null 2>&1; do
                echo "waiting for the docker daemon"
                sleep 2
              done
              rm -rf src
              git -c http.sslVerify=false clone --depth 1 https://github.com/janushanth/gitops-argocd-kargo-demo.git src
              VERSION="1.0.$(date +%s)"
              IMAGE="localhost:32082/hello-world:${VERSION}"
              docker build --build-arg VERSION="${VERSION}" -t "${IMAGE}" src/hello-world
              printf '%s\n' 'admin123' | docker login localhost:32082 -u admin --password-stdin
              docker push "${IMAGE}"
              echo "pushed ${IMAGE}"
            '''
          }
        }
      }
    }
