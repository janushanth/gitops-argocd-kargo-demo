apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-docker-repo
  namespace: nexus
data:
  bootstrap.py: |
    import base64
    import json
    import time
    import urllib.error
    import urllib.request

    base = "http://nexus.nexus.svc.cluster.local:8081"
    token = base64.b64encode(b"admin:admin123").decode()
    headers = {
        "Authorization": "Basic " + token,
        "Content-Type": "application/json",
    }

    def ready():
        request = urllib.request.Request(base + "/service/rest/v1/status", headers=headers)
        with urllib.request.urlopen(request, timeout=10) as response:
            return response.status == 200

    for _ in range(60):
        try:
            if ready():
                break
        except Exception as exc:
            print("waiting for nexus", exc, flush=True)
        time.sleep(10)
    else:
        raise SystemExit("nexus did not become ready")

    body = json.dumps({
        "name": "hello-world",
        "online": True,
        "storage": {
            "blobStoreName": "default",
            "strictContentTypeValidation": False,
            "writePolicy": "ALLOW",
        },
        "docker": {
            "v1Enabled": False,
            "forceBasicAuth": True,
            "httpPort": 8082,
        },
    }).encode()
    request = urllib.request.Request(
        base + "/service/rest/v1/repositories/docker/hosted",
        data=body,
        headers=headers,
        method="POST",
    )
    try:
        with urllib.request.urlopen(request, timeout=30) as response:
            print("created docker repository", response.status, flush=True)
    except urllib.error.HTTPError as exc:
        detail = exc.read().decode()
        print(exc.code, detail, flush=True)
        if exc.code in (400, 409) and "exist" in detail.lower():
            raise SystemExit(0)
        raise
