apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-docker-repo
  namespace: nexus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/config/bootstrap.py"]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: nexus-docker-repo
