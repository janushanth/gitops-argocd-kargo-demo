name: build-and-publish

on:
  push:
    branches: [main]
    paths:
      - "hello-world/**"
      - ".github/workflows/build-publish.yml"
  workflow_dispatch:

# Kargo commits only under gitops/. Those pushes must not start another build.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Nexus settings
        env:
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          test -n "$NEXUS_REGISTRY" || (echo "Set repository secret NEXUS_REGISTRY to the Nexus Docker host:port" && exit 1)
          test -n "$NEXUS_USERNAME" || (echo "Set repository secret NEXUS_USERNAME" && exit 1)
          test -n "$NEXUS_PASSWORD" || (echo "Set repository secret NEXUS_PASSWORD" && exit 1)

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./hello-world
          push: true
          build-args: VERSION=1.0.${{ github.run_number }}
          tags: ${{ secrets.NEXUS_REGISTRY }}/hello-world:1.0.${{ github.run_number }}
