apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: hello-world
  annotations:
    kargo.akuity.io/color: "#e76f51"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world
      sources:
        stages:
          - test
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/janushanth/gitops-argocd-kargo-demo.git
        - name: imageRepo
          value: localhost:32082/hello-world
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            # Corporate TLS inspection: the git-clone step needs this flag.
            # The gitops-repo secret field alone is not used by promotions.
            insecureSkipTLSVerify: true
            checkout:
              - branch: main
                path: ./src
        - uses: yaml-update
          as: update-image
          config:
            path: ./src/gitops/prod/deployment.yaml
            updates:
              - key: spec.template.spec.containers.0.image
                value: ${{ vars.imageRepo }}:${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          config:
            path: ./src
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ./src
            targetBranch: main
        - uses: argocd-update
          config:
            apps:
              - name: hello-world-prod
        - uses: argocd-wait
          config:
            apps:
              - name: hello-world-prod
