apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hello-world
  namespace: hello-world
spec:
  subscriptions:
    - image:
        # Replace nexus.example.com:8082 with your Nexus Docker host:port.
        # The GitHub Actions secret NEXUS_REGISTRY must be that same host:port.
        repoURL: nexus.example.com:8082/hello-world
        insecureSkipTLSVerify: true
        imageSelectionStrategy: SemVer
        strictSemvers: true
        constraint: ">=1.0.0"
        allowTagsRegexes:
          - ^1\.0\.\d+$
