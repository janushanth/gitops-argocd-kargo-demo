apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hello-world
  namespace: hello-world
spec:
  subscriptions:
    - image:
        # localhost is plain HTTP for both Kargo and the local Docker engine.
        # Jenkins pushes this same host:port, and the Deployments pull it.
        repoURL: localhost:32082/hello-world
        insecureSkipTLSVerify: true
        imageSelectionStrategy: SemVer
        strictSemvers: true
        constraint: ">=1.0.0"
        allowTagsRegexes:
          - ^1\.0\.\d+$
