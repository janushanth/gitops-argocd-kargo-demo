# Local demo only. Docker Desktop sits behind TLS inspection, so the
# certificate GitHub presents is signed by a CA the Argo CD container
# does not trust. insecure skips that check for this public repo.
apiVersion: v1
kind: Secret
metadata:
  name: gitops-argocd-kargo-demo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/janushanth/gitops-argocd-kargo-demo.git
  insecure: "true"
