apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
spec:
  project: default
  source:
    # Chart vendored in this repo (helm pull of kargo 1.12.5), so Argo CD
    # reads it from GitHub instead of ghcr.io, which the corporate TLS
    # inspection breaks inside the cluster.
    repoURL: https://github.com/janushanth/gitops-argocd-kargo-demo.git
    targetRevision: main
    path: install/kargo/chart/kargo
    helm:
      releaseName: kargo
      valuesObject:
        api:
          service:
            type: NodePort
            nodePort: 31081
          tls:
            enabled: false
          adminAccount:
            # Public local-only values from the Kargo quickstart.
            passwordHash: "$2a$10$Zrhhie4vLz5ygtVSaif6o.qN36jgs6vjtMBdM6yrU1FOeiAAMMxOm"
            tokenSigningKey: iwishtowashmyirishwristwatch
        database:
          postgres:
            password: kargo
        externalWebhooksServer:
          service:
            type: NodePort
            nodePort: 31082
          tls:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
