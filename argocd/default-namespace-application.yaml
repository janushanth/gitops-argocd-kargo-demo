apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: default-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/janushanth/gitops-argocd-kargo-demo.git
    targetRevision: main
    path: platform/default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    # No workload lives in this path. The Application only labels default,
    # where the existing my-nginx release runs. Prune stays off.
    managedNamespaceMetadata:
      labels:
        goldilocks.fairwinds.com/enabled: "true"
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
