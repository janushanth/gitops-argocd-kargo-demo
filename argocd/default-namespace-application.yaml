apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: default-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/janushanth/gitops-argocd-kargo-demo.git
    targetRevision: main
    path: platform/default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      # Prune stays off. This Application only adds the Goldilocks label.
      # Prune would delete the default namespace, including the existing my-nginx release.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
