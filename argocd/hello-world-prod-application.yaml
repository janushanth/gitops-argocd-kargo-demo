apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-prod
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: hello-world:prod
spec:
  project: default
  source:
    repoURL: https://github.com/janushanth/gitops-argocd-kargo-demo.git
    targetRevision: main
    path: gitops/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-prod
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        goldilocks.fairwinds.com/enabled: "true"
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
